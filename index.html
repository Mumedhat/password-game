// تنظيف وإزالة التكرار
(function(){const seen=new Set();const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");
for(let i=FOOT.length-1;i>=0;i--){const x=FOOT[i];if(!x[4]||!x[3].filter(Boolean).length||x[5]>2){FOOT.splice(i,1)}}
const out=[];for(const x of FOOT){const k=norm(x[1]),a=x[0].replace(/\s/g,"");if(seen.has(k)||seen.has(a))continue;seen.add(k);seen.add(a);out.push(x)}FOOT.length=0;out.forEach(x=>FOOT.push(x))})();

const CATS={foot:{data:FOOT,subs:["الكل","محلي","عالمي"]},hist:{data:HIST,subs:["الكل","علوم","تاريخ","سياسة","أدب","رياضة","اكتشافات","تكنولوجيا"]}};
let lvl="الكل",cat="foot",sub="الكل",cur=null,turn=0,score=[0,0],used={foot:[],hist:[]},t=null,left=60;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("pw",JSON.stringify({used,score,turn}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("pw"));if(s){used=s.used||used;score=s.score||score;turn=s.turn||0}}catch(e){}

function chips(){$("chips").innerHTML=CATS[cat].subs.map(s=>`<button class="chip${s===sub?" on":""}">${s}</button>`).join("");
 [...$("chips").children].forEach(b=>b.onclick=()=>{sub=b.textContent;chips();count()})}
function pool(){return CATS[cat].data.filter(x=>(sub==="الكل"||x[2]===sub)&&(lvl==="الكل"||(lvl==="😌 عادي"&&!x[5])||(lvl==="🔥 صعب"&&x[5]===1)||(lvl==="💀 صعب جداً"&&x[5]===2)))}
function lvChips(){$("lv").innerHTML=["الكل","😌 عادي","🔥 صعب","💀 صعب جداً"].map(s=>`<button class="chip${s===lvl?" on":""}">${s}</button>`).join("");[...$("lv").children].forEach(b=>b.onclick=()=>{lvl=b.textContent;lvChips();count()})}
function count(){const p=pool();$("left").textContent=`فاضل ${p.filter(x=>!used[cat].includes(x[1])).length} من ${p.length}`}
function paintScore(){$("sA").textContent=score[0];$("sB").textContent=score[1];$("tA").classList.toggle("turn",turn===0);$("tB").classList.toggle("turn",turn===1)}

function next(){
 stop();left=60;showT();
 let p=pool(),fresh=p.filter(x=>!used[cat].includes(x[1]));
 if(!fresh.length){used[cat]=used[cat].filter(n=>!p.some(x=>x[1]===n));fresh=p}
 cur=fresh[Math.floor(Math.random()*fresh.length)];used[cat].push(cur[1]);save();count();
 const h=cur[3].filter(Boolean).map(x=>`<li>${x}</li>`).join("");
 $("card").innerHTML=`<span class="tag">${cur[2]}${cur[5]===2?" · 💀 صعب جداً":cur[5]?" · 🔥 صعب":""}</span><p class="name">${cur[0]}</p><p class="en">${cur[1]}</p><ul>${h}</ul><div class="act"><b>🎭 مثّله كده:</b> ${cur[4]}</div>
 <div class="cover" id="cover"><div class="big">🙈</div><b>دوس عشان تشوف الاسم</b><p>اتأكد إن فريق الممثل مش باصص</p></div>`;
 $("cover").onclick=e=>e.currentTarget.remove();
}
function showT(){$("timer").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;$("timer").classList.toggle("low",left<=10)}
function beep(f,d){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function stop(){clearInterval(t);t=null;$("start").textContent="⏱️ ابدأ"}
$("start").onclick=()=>{if(t){stop();return}if(left<=0)left=60;$("start").textContent="⏸️ وقف";beep(660,.12);
 t=setInterval(()=>{left--;showT();if(left<=5&&left>0)beep(880,.08);if(left<=0){stop();beep(300,.7);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}},1000)};
function done(ok){stop();if(ok)score[turn]++;turn=1-turn;save();paintScore();
 $("card").innerHTML=`<div class="empty">${ok?"🎉 نقطة!":"😅 ملحوقة"}<br>الدور على <b>${document.querySelectorAll(".team input")[turn].value}</b> — دوس «اسم جديد»</div>`}
$("yes").onclick=()=>done(true);$("no").onclick=()=>done(false);
$("next").onclick=next;
$("reset").onclick=()=>{used={foot:[],hist:[]};score=[0,0];turn=0;save();paintScore();count()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");cat=b.dataset.cat;sub="الكل";chips();count();$("card").innerHTML='<div class="empty">دوس «اسم جديد» تحت 👇</div>'});
chips();lvChips();count();paintScore();
</script>
